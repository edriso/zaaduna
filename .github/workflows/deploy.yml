# CI + push-to-deploy. The `test` job (typecheck, format, tests) runs on every
# push to main AND on every pull request to main, so dependency-bump PRs (e.g.
# Renovate bumping grammy or node-cron) show a green/red check before merge. The
# `deploy` job runs ONLY on a push to main: it SSHes into the VPS, pulls the
# latest code, and rebuilds just this bot's container.
#
# zaaduna has no database, so there is no migrate/seed step — the deploy is a
# plain rebuild. `set -e` aborts the deploy if any step fails, so a failed pull
# or build is never followed by a half-applied restart.
#
# Required GitHub secrets (repo -> Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   SERVER_IP  the VPS IP (e.g. <your-server-ip>)
#   SSH_KEY    a private SSH key whose public half is in the server's
#              /root/.ssh/authorized_keys
#
# Until both secrets are set, this workflow fails at the connect step —
# that is expected; add the secrets to activate it.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate: typecheck + format + tests must pass before we touch production. A
  # push that breaks the build never reaches the server (it would otherwise fail
  # to boot or misbehave with no warning). Also runs on PRs so bump PRs are
  # checked.
  test:
    runs-on: ubuntu-latest
    # Dummy values so importing src/config.ts (which requires these at load
    # time) does not throw; the tests never connect to Telegram.
    env:
      BOT_TOKEN: ci-placeholder
      CHANNEL_CHAT_ID: '@ci-placeholder'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: test
    # Only deploy on a real push to main, never on a pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/bots/telegram/zaaduna && git pull
            cd /opt/bots && docker compose up -d --build zaaduna
            docker image prune -f
